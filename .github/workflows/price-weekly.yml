# GPU 임대가(GetDeploying·Lambda·RunPod·CoreWeave) + 메모리 가격(TrendForce) 매일 수집
# 결과: price_data/price_history.csv(전체 일별 이력) + 대시보드용 주간 JSON
name: GPU memory prices weekly

on:
  schedule:
    - cron: "0 20 * * *"   # 매일 20:00 UTC (한국 5:00)
  workflow_dispatch:       # 수동 실행 버튼
    inputs:
      dump_text:
        description: "페이지 텍스트를 price_data/_debug/에 저장 (파서 점검용, true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Collect
        run: |
          if [ "${{ github.event.inputs.dump_text }}" = "true" ]; then
            xvfb-run -a python price_tracker.py --out-dir price_data --dump-text
          else
            xvfb-run -a python price_tracker.py --out-dir price_data
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add price_data
          git diff --cached --quiet || git commit -m "GPU/memory prices $(TZ=Asia/Seoul date +%F)"
          git push
